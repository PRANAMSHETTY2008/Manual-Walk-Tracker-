
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walk Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Walk Tracker</h1>
        <p>Your Daily Walking Companion</p>

        <div class="tracker">
            <h2>Today's Steps</h2>
            <h1 id="steps">0</h1>
            <p>Steps Walked</p>

            <h3>Daily Goal: 10,000</h3>

            <button id="startBtn">Start Walking</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
